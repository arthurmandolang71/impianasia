<svg width="600" height="480" viewBox="0 0 600 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Visualisasi infrastruktur teknologi">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1F2024" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background grid -->
  <rect width="600" height="480" fill="url(#grid)"/>

  <!-- Glow blob -->
  <circle cx="420" cy="200" r="160" fill="url(#g2)"/>

  <!-- Card mockup 1 — dashboard -->
  <g transform="translate(60,80)">
    <rect x="0" y="0" width="320" height="200" rx="12" fill="#131417" stroke="#2A2B30" stroke-width="1"/>
    <rect x="20" y="22" width="90" height="8" rx="4" fill="#2A2B30"/>
    <rect x="20" y="38" width="140" height="5" rx="2.5" fill="#1F2024"/>
    <!-- chart bars -->
    <rect x="20" y="150" width="24" height="30" rx="3" fill="#10B981" fill-opacity="0.6"/>
    <rect x="54" y="120" width="24" height="60" rx="3" fill="#10B981" fill-opacity="0.7"/>
    <rect x="88" y="90" width="24" height="90" rx="3" fill="#10B981" fill-opacity="0.85"/>
    <rect x="122" y="105" width="24" height="75" rx="3" fill="#10B981" fill-opacity="0.7"/>
    <rect x="156" y="70" width="24" height="110" rx="3" fill="#10B981"/>
    <rect x="190" y="135" width="24" height="45" rx="3" fill="#10B981" fill-opacity="0.5"/>
    <rect x="224" y="100" width="24" height="80" rx="3" fill="#10B981" fill-opacity="0.7"/>
    <rect x="258" y="115" width="24" height="65" rx="3" fill="#10B981" fill-opacity="0.6"/>
  </g>

  <!-- Floating stat chip -->
  <g transform="translate(330,210)">
    <rect x="0" y="0" width="180" height="70" rx="10" fill="#1A1B1F" stroke="#2A2B30" stroke-width="1"/>
    <circle cx="22" cy="35" r="10" fill="#10B981" fill-opacity="0.2"/>
    <path d="M17 35 L21 39 L27 31" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="42" y="22" width="80" height="7" rx="3.5" fill="#FAFAFA"/>
    <rect x="42" y="38" width="110" height="5" rx="2.5" fill="#71717A"/>
    <rect x="42" y="50" width="60" height="5" rx="2.5" fill="#2A2B30"/>
  </g>

  <!-- Connection nodes -->
  <g transform="translate(60,310)">
    <circle cx="20" cy="20" r="6" fill="#10B981"/>
    <circle cx="120" cy="40" r="6" fill="#10B981" fill-opacity="0.6"/>
    <circle cx="220" cy="20" r="6" fill="#10B981" fill-opacity="0.8"/>
    <circle cx="320" cy="50" r="6" fill="#10B981" fill-opacity="0.5"/>
    <path d="M20 20 L120 40 L220 20 L320 50" stroke="#10B981" stroke-width="1" stroke-opacity="0.3" fill="none"/>
    <rect x="350" y="35" width="90" height="6" rx="3" fill="#2A2B30"/>
  </g>
</svg>
