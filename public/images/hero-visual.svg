<svg width="560" height="520" viewBox="0 0 560 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dashboard analitik data Pengaduan Ai dan Jasaku">
  <defs>
    <!-- Glow & gradients -->
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1B1F"/>
      <stop offset="100%" stop-color="#131417"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2A2B30"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient glow behind everything -->
  <rect width="560" height="520" fill="url(#glow)"/>
  <rect width="560" height="520" fill="url(#dots)" opacity="0.4"/>

  <!-- ═══ Main dashboard card ═══ -->
  <g filter="url(#soft)">
    <rect x="40" y="60" width="400" height="340" rx="14" fill="url(#cardGrad)" stroke="#2A2B30" stroke-width="1"/>

    <!-- Header bar -->
    <circle cx="62" cy="84" r="4" fill="#F87171" opacity="0.7"/>
    <circle cx="76" cy="84" r="4" fill="#FBBF24" opacity="0.7"/>
    <circle cx="90" cy="84" r="4" fill="#10B981" opacity="0.9"/>
    <rect x="340" y="78" width="80" height="12" rx="6" fill="#1F2024"/>

    <!-- Title row -->
    <rect x="60" y="112" width="140" height="11" rx="3" fill="#FAFAFA"/>
    <rect x="60" y="130" width="200" height="6" rx="2" fill="#1F2024"/>

    <!-- KPI cards row -->
    <rect x="60" y="156" width="104" height="56" rx="8" fill="#0E0F11" stroke="#1F2024"/>
    <rect x="74" y="170" width="40" height="5" rx="2" fill="#71717A"/>
    <rect x="74" y="182" width="60" height="14" rx="3" fill="#FAFAFA"/>

    <rect x="176" y="156" width="104" height="56" rx="8" fill="#0E0F11" stroke="#1F2024"/>
    <rect x="190" y="170" width="40" height="5" rx="2" fill="#71717A"/>
    <rect x="190" y="182" width="70" height="14" rx="3" fill="#FAFAFA"/>

    <rect x="292" y="156" width="124" height="56" rx="8" fill="#0E3B2E" stroke="#10B981" stroke-opacity="0.3"/>
    <rect x="306" y="170" width="50" height="5" rx="2" fill="#10B981" opacity="0.7"/>
    <rect x="306" y="182" width="80" height="14" rx="3" fill="#10B981"/>
    <!-- tiny sparkline in KPI3 -->
    <polyline points="370,196 376,192 382,194 388,188 394,190 400,184" stroke="#10B981" stroke-width="1.2" fill="none" stroke-opacity="0.6"/>

    <!-- Area chart -->
    <rect x="60" y="232" width="100" height="8" rx="3" fill="#1F2024"/>
    <g transform="translate(60,256)">
      <!-- baseline -->
      <line x1="0" y1="120" x2="356" y2="120" stroke="#1F2024" stroke-width="1"/>
      <!-- horizontal gridlines -->
      <line x1="0" y1="80" x2="356" y2="80" stroke="#1F2024" stroke-width="0.5" stroke-dasharray="2 4"/>
      <line x1="0" y1="40" x2="356" y2="40" stroke="#1F2024" stroke-width="0.5" stroke-dasharray="2 4"/>
      <!-- area fill -->
      <path d="M0 100 L40 86 L80 92 L120 70 L160 76 L200 54 L240 60 L280 38 L320 44 L356 22 L356 120 L0 120 Z" fill="url(#area)"/>
      <!-- line -->
      <path d="M0 100 L40 86 L80 92 L120 70 L160 76 L200 54 L240 60 L280 38 L320 44 L356 22" stroke="#10B981" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- end dot -->
      <circle cx="356" cy="22" r="4" fill="#10B981"/>
      <circle cx="356" cy="22" r="8" fill="#10B981" fill-opacity="0.25"/>
    </g>
  </g>

  <!-- ═══ Floating status chip (top-right, overlapping) ═══ -->
  <g filter="url(#soft)" transform="translate(330,30)">
    <rect x="0" y="0" width="200" height="74" rx="12" fill="#1A1B1F" stroke="#2A2B30" stroke-width="1"/>
    <circle cx="28" cy="37" r="14" fill="#10B981" fill-opacity="0.15"/>
    <path d="M22 37 L26 41 L34 33" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="52" y="24" width="90" height="9" rx="2" fill="#FAFAFA"/>
    <rect x="52" y="40" width="128" height="6" rx="2" fill="#71717A"/>
    <rect x="52" y="52" width="70" height="5" rx="2" fill="#2A2B30"/>
  </g>

  <!-- ═══ Floating channel row (bottom-left, overlapping) ═══ -->
  <g filter="url(#soft)" transform="translate(20,360)">
    <rect x="0" y="0" width="220" height="86" rx="12" fill="#1A1B1F" stroke="#2A2B30" stroke-width="1"/>
    <rect x="16" y="16" width="64" height="5" rx="2" fill="#71717A"/>
    <rect x="16" y="28" width="120" height="9" rx="2" fill="#FAFAFA"/>
    <!-- channel dots -->
    <g transform="translate(16,52)">
      <circle cx="8" cy="8" r="8" fill="#0E0F11" stroke="#2A2B30"/>
      <text x="8" y="11" font-family="Arial" font-size="8" fill="#10B981" text-anchor="middle">W</text>
      <circle cx="32" cy="8" r="8" fill="#0E0F11" stroke="#2A2B30"/>
      <text x="32" y="11" font-family="Arial" font-size="7" fill="#FAFAFA" text-anchor="middle">@</text>
      <circle cx="56" cy="8" r="8" fill="#0E0F11" stroke="#2A2B30"/>
      <text x="56" y="11" font-family="Arial" font-size="8" fill="#FAFAFA" text-anchor="middle">M</text>
      <circle cx="80" cy="8" r="8" fill="#0E0F11" stroke="#2A2B30"/>
      <text x="80" y="11" font-family="Arial" font-size="7" fill="#FAFAFA" text-anchor="middle">f</text>
      <circle cx="104" cy="8" r="8" fill="#0E3B2E" stroke="#10B981" stroke-opacity="0.4"/>
      <text x="104" y="11" font-family="Arial" font-size="8" fill="#10B981" text-anchor="middle">+</text>
    </g>
    <text x="180" y="60" font-family="Inter, sans-serif" font-size="10" fill="#71717A">5 kanal</text>
  </g>
</svg>
